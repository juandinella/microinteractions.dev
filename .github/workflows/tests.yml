# Runs the site's Playwright suite against the production Worker, and installs every study from the
# built shadcn registry into consumer/ to check that it type-checks, renders on the server, hydrates,
# and behaves. The site's build alone can't show that an installed component works.
# Four parallel jobs: the site suite in Chromium, the site suite in WebKit in two halves (it's the slowest, and
# more workers per runner squeeze the tests that measure real time), and the Tailwind checker's self-test with
# the consumer check.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # A merge to main with the same files as its pull request was already tested there. Anything else runs:
  # a direct push, a branch behind main, or a pull request merged before its tests passed.
  already-tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse --verify --quiet HEAD^2) || { echo "Not a merge."; exit 0; }
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "$head^{tree}")" ]; then
            echo "The merge changed files."
            exit 0
          fi
          results=$(gh api "repos/${{ github.repository }}/commits/$head/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name | startswith("test (")) | .conclusion] | unique | map(tostring) | join(",")' || true)
          echo "Tests on $head: ${results:-none}"
          if [ "$results" = success ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: already-tested
    # Also when the job above was skipped (pull requests) or failed.
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      # A failure in one suite shouldn't cancel the others' results.
      fail-fast: false
      matrix:
        include:
          - suite: chromium
            args: --project=chromium
          - suite: webkit-1
            args: --project=webkit --shard=1/2
          - suite: webkit-2
            args: --project=webkit --shard=2/2
          - suite: consumer
    # Ships the browsers and their system packages. Installing them with apt took up to 13 minutes on a slow
    # mirror, longer than the tests. The tag must match @playwright/test; the first step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'consumer'
        run: npm ci --no-audit --no-fund
        working-directory: consumer
      - name: Check the image matches @playwright/test
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          grep -q "mcr.microsoft.com/playwright:v$version-" .github/workflows/tests.yml \
            || { echo "Update the container image in tests.yml to v$version."; exit 1; }
      # Each suite builds the site first: the browser suites through the Playwright web server, and the
      # consumer check through check-consumer.mjs, which installs from that build.
      - if: matrix.suite != 'consumer'
        run: pnpm run test:e2e ${{ matrix.args }}
      - if: matrix.suite == 'consumer'
        run: pnpm exec node --test scripts/check-tailwind.test.mjs
      - if: matrix.suite == 'consumer'
        run: pnpm run test:consumer
      # Traces and screenshots of failing tests, for debugging what only fails in CI.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.suite }}
          path: |
            test-results/
            consumer/test-results/
          retention-days: 7
