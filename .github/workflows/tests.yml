# Runs the site's Playwright suite against the production Worker, then installs every study from the
# built shadcn registry into consumer/ and checks that it type-checks, renders on the server, hydrates,
# and behaves. The site's build alone can't show that an installed component works.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Ships the browsers and their system packages. Installing them with apt took up to 13 minutes on a slow
    # mirror, longer than the tests. The tag must match @playwright/test; the first step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --no-audit --no-fund
        working-directory: consumer
      - name: Check the image matches @playwright/test
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          grep -q "mcr.microsoft.com/playwright:v$version-" .github/workflows/tests.yml \
            || { echo "Update the container image in tests.yml to v$version."; exit 1; }
      - run: pnpm exec node --test scripts/check-tailwind.test.mjs
      # Builds the site; the consumer check installs from that build.
      - run: pnpm run test:e2e
      - run: pnpm run test:consumer
      # Traces and screenshots of failing tests, for debugging what only fails in CI.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            consumer/test-results/
          retention-days: 7
