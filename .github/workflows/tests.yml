# Runs the site's Playwright suite against the production Worker, then installs every study from the
# built shadcn registry into consumer/ and checks that it type-checks, renders on the server, hydrates,
# and behaves. The site's build alone can't show that an installed component works.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --no-audit --no-fund
        working-directory: consumer
      - run: pnpm exec node --test scripts/check-tailwind.test.mjs
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Builds the site; the consumer check installs from that build.
      - run: pnpm run test:e2e
      - run: pnpm run test:consumer
