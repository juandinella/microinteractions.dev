# Renders social covers for new or edited studies and commits them to the pull request.
# The build fails without a study's cover, so this runs before Cloudflare's preview build matters.
name: Social covers

on:
  pull_request:
    paths:
      - src/data/specimens.ts
      - src/data/social-image.json
      - src/lib/social-image.ts
      - scripts/generate-social-image.mjs
      - public/fonts/**
      - public/logo.svg
      # A Playwright upgrade must move the container image too; the check below catches it in that pull request.
      - package.json
      - .github/workflows/social-covers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-covers-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  covers:
    # Forks can't receive commits from this token.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Ships Chromium and its system packages. Installing them with apt failed when the runner couldn't reach
    # the Ubuntu mirror. The tag must match @playwright/test; the first step after install checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the image matches @playwright/test
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          grep -q "mcr.microsoft.com/playwright:v$version-" .github/workflows/social-covers.yml \
            || { echo "Update the container image in social-covers.yml to v$version."; exit 1; }
      - run: pnpm run generate:social
      - name: Commit changed covers
        run: |
          git add public/social-preview.png public/social src/data/social-covers.json
          if git diff --cached --quiet; then
            echo "Covers are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate social covers"
          git push
